# Publishes the site to GitHub Pages on every push to main, after each
# nightly "Refresh data" run, and on demand. The refresh job pushes with
# GITHUB_TOKEN, and those pushes don't start other workflows or Pages builds,
# hence the workflow_run trigger.
#
# Repo setting: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Refresh data]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/configure-pages@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Copies the site files into _site (not tools/, the README or the
      # workflows), then adds a page and a share image per game, sitemap.xml
      # and robots.txt.
      - name: Build the site
        run: |
          pip install pillow
          python tools/build_pages.py

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
