# Update alerts: every hour, checks the projects people follow for a new
# release on GitHub and emails their followers (tools/send_alerts.py). Off
# until the MAIL_API_URL and MAIL_ADMIN_TOKEN secrets are set: see
# newsletter/README.md.
name: Update alerts

on:
  schedule:
    - cron: '41 * * * *'   # every hour, at 41 minutes past
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check followed projects and send alerts
        env:
          MAIL_API_URL: ${{ secrets.MAIL_API_URL }}
          MAIL_ADMIN_TOKEN: ${{ secrets.MAIL_ADMIN_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install pillow
          python tools/send_alerts.py
